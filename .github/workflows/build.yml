name: CI
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.foros9
            drbd_tag: drbd-9.3.2
            util_tag: v9.34.0
            image_tag: "9"
          - dockerfile: Dockerfile.foros10
            drbd_tag: drbd-9.3.2
            util_tag: v9.34.0
            image_tag: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Check if release exists
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking available kernel-devel version for AlmaLinux ${{ matrix.image_tag }}..."
          KERNEL=$(docker run --rm almalinux:${{ matrix.image_tag }} /bin/bash -c "yum info kernel-devel 2>/dev/null | awk '/^Arch/{ARCH=\$3}/^Version/{VER=\$3}/^Release/{REL=\$3}END{print VER \"-\" REL \".\" ARCH}'")
          echo "Target kernel-devel version: $KERNEL"
          
          if [ -z "$KERNEL" ]; then
            echo "Failed to retrieve kernel-devel version."
            exit 1
          fi
          
          # Calculate the exact release tag
          TAG="${{ matrix.drbd_tag }}-${{ matrix.util_tag }}-${KERNEL}"
          echo "Target release tag: $TAG"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check-release.outputs.exists != 'true'
        env:
          BUILD_DIR: ${{ github.workspace }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          DRBD_TAG: ${{ matrix.drbd_tag }}
          UTIL_TAG: ${{ matrix.util_tag }}
        run: |
          mkdir -p $BUILD_DIR/build
          
          # Build Docker builder image
          docker build -t builder -f $DOCKERFILE . --build-arg DRBD_TAG=$DRBD_TAG --build-arg UTIL_TAG=$UTIL_TAG --build-arg IMAGE_TAG=$IMAGE_TAG
          
          # Run compilation
          docker run --rm --privileged -v RPMS:/home/builder/rpmbuild/RPMS builder
          
          # Export compiled RPMs archive (.tar.gz)
          VERSION_NAME=$(docker run --rm builder /bin/bash version.sh)
          docker run --rm -v RPMS:/home/builder/rpmbuild/RPMS builder tar -cz -C /home/builder/rpmbuild RPMS > $BUILD_DIR/build/${VERSION_NAME}.tar.gz
          
          # Export individual .rpm files
          docker run --rm -v RPMS:/home/builder/rpmbuild/RPMS -v $BUILD_DIR/build:/host_build builder find /home/builder/rpmbuild/RPMS -name "*.rpm" -exec cp {} /host_build/ \;
          
          # Ensure file readability
          sudo chmod -R a+r $BUILD_DIR/build
          
          # Clean up volume
          docker volume rm RPMS

      - name: Release
        if: steps.check-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.check-release.outputs.release_tag }}
          tag_name: ${{ steps.check-release.outputs.release_tag }}
          files: |
            build/*.tar.gz
            build/*.rpm
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
